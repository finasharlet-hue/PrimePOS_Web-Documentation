<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimePOS — User Guide (Bootstrap 5)</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/custom.css">
<script src="js/theme.js"></script>
</head>
<body>

<nav class="navbar pp-navbar navbar-dark sticky-top py-2 py-md-3">
  <div class="container-fluid px-3 px-md-4 d-flex align-items-center flex-nowrap gap-2">
    <button type="button" class="btn pp-hamburger d-md-none p-1" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="Open menu">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
    </button>
    <span class="navbar-brand pp-brand mb-0 d-flex align-items-baseline flex-shrink-0">
      <span class="prime">Prime</span><span class="pos">POS</span><span class="pp-brand-sub d-none d-sm-inline">USER GUIDE</span>
    </span>
    <div class="mx-auto d-none d-md-block" style="width:100%; max-width:360px;">
      <input id="searchInput" type="text" class="form-control form-control-sm" placeholder="Search topics…">
    </div>
    <span class="text-white-50 small d-none d-xl-inline ms-auto me-2" id="crumbRight">Retail &amp; Wholesale · All Modules</span>
    <div class="pp-theme-switch d-flex gap-1 ms-auto ms-md-0 flex-shrink-0" role="group" aria-label="Theme switcher">
      <button type="button" class="pp-theme-btn" data-theme-btn="default" title="Light theme" aria-label="Light theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      </button>
      <button type="button" class="pp-theme-btn" data-theme-btn="dark" title="Dark theme" aria-label="Dark theme">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <aside class="offcanvas-md offcanvas-start col-md-3 col-lg-3 pp-sidebar border-end" tabindex="-1" id="sidebarOffcanvas">
      <div class="offcanvas-header d-md-none">
        <span class="pp-brand mb-0 d-flex align-items-baseline"><span class="prime">Prime</span><span class="pos">POS</span></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-block py-4 px-3">
        <div class="text-uppercase text-muted small fw-bold mb-2 px-1">What do you need help with?</div>
        <div id="sidebarAccordion"></div>
      </div>
    </aside>
    <main class="col-md-9 col-lg-9 py-4 px-4 px-md-5" id="mainContent" style="max-width:900px;"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
